
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin | Bhopal Furnished</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#efe7d6;font-family:Arial,sans-serif;line-height:1.5;padding:20px}
.w{max-width:760px;margin:0 auto}
h1{color:#f0cf8a;margin-bottom:4px}
h2{color:#f0cf8a;font-size:19px;margin-bottom:12px}
.card{background:#141210;border:1px solid #3a2f1c;border-radius:6px;padding:20px;margin:18px 0}
label{display:block;font-size:14px;color:#a89d86;margin-top:12px}
input,select{width:100%;margin-top:4px;padding:11px;background:#0a0a0a;color:#efe7d6;border:1px solid #3a2f1c;border-radius:4px;font-size:16px}
button{margin-top:16px;padding:12px 22px;background:#d9a441;color:#0a0a0a;border:0;border-radius:4px;font-weight:700;font-size:16px;cursor:pointer}
button:disabled{opacity:.5}
button.del{margin:0;padding:6px 12px;background:#7a2a2a;color:#fff;font-size:14px}
#msg{margin-top:14px;padding:10px;border-radius:4px;display:none}
.ok{background:#1d3a22;display:block!important}.err{background:#4a1d1d;display:block!important}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #3a2f1c}
.row img{width:70px;height:55px;object-fit:cover;border-radius:3px}
.row div{flex:1;font-size:15px}.row small{color:#a89d86;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="w">
  <h1>Bhopal Furnished Admin</h1>
  <p style="color:#a89d86">Furniture ki photos upload ya delete karo.</p>

  <div class="card">
    <h2>1. GitHub connection</h2>
    <div class="two">
      <label>GitHub username<input id="owner"></label>
      <label>Repository name<input id="repo"></label>
    </div>
    <label>Access token (sirf aapke phone/computer mein save hota hai)<input id="token" type="password" autocomplete="off"></label>
    <button id="save" type="button">Save and load photos</button>
  </div>

  <div class="card">
    <h2>2. Upload photos</h2>
    <label>Category
      <select id="cat">
        <option value="orders">Custom Furniture Orders</option>
        <option value="polish">Furniture Polish</option>
      </select>
    </label>
    <label>Title (optional, e.g. Double bed, Sheesham wood)<input id="title" maxlength="60"></label>
    <label>Photos (ek saath kai select kar sakte ho)<input id="files" type="file" accept="image/*" multiple></label>
    <button id="up" type="button">Upload</button>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h2>3. Uploaded photos</h2>
    <div id="list"><p style="color:#a89d86">Pehle upar token save karo.</p></div>
  </div>
</div>

<script>
var $ = function(id){return document.getElementById(id);};
var onPages = location.hostname.endsWith('github.io');
var parts = location.pathname.split('/').filter(Boolean);
$('owner').value = localStorage.getItem('bf_owner') || (onPages ? location.hostname.split('.')[0] : '');
$('repo').value = localStorage.getItem('bf_repo') || (onPages && parts.length > 1 ? parts[0] : '');
$('token').value = localStorage.getItem('bf_token') || '';

function show(text, ok){var m=$('msg');m.textContent=text;m.className=ok?'ok':'err';}
function api(path, opt){
  opt = opt || {};
  opt.headers = {Authorization:'Bearer '+$('token').value.trim(), Accept:'application/vnd.github+json', 'Content-Type':'application/json'};
  return fetch('https://api.github.com/repos/'+$('owner').value.trim()+'/'+$('repo').value.trim()+'/contents/'+path, opt);
}
function b64text(str){var b=new TextEncoder().encode(str),s='';b.forEach(function(c){s+=String.fromCharCode(c);});return btoa(s);}
function unb64text(b){return new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),function(c){return c.charCodeAt(0);}));}
async function fail(res){
  var j={};try{j=await res.json();}catch(e){}
  var hint = res.status===401 ? ' (token galat ya expire ho gaya)' : res.status===403||res.status===404 ? ' (username, repository name ya token ki permission check karo)' : '';
  throw new Error('GitHub error '+res.status+': '+(j.message||'')+hint);
}
async function getGallery(){
  var r = await api('gallery.json?ref=main&t='+Date.now());
  if(r.status===404) return {list:[],sha:null};
  if(!r.ok) await fail(r);
  var j = await r.json();
  return {list:JSON.parse(unb64text(j.content)), sha:j.sha};
}
async function putGallery(list, sha){
  var body = {message:'Update gallery', content:b64text(JSON.stringify(list,null,1))};
  if(sha) body.sha = sha;
  var r = await api('gallery.json',{method:'PUT',body:JSON.stringify(body)});
  if(!r.ok) await fail(r);
}
function resize(file){
  return new Promise(function(resolve,reject){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var max=1400, k=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',0.82).split(',')[1]);
    };
    img.onerror=function(){reject(new Error('Photo khul nahi payi: '+file.name));};
    img.src=url;
  });
}
async function render(){
  try{
    var g = await getGallery(), box=$('list');
    box.innerHTML='';
    if(!g.list.length){box.innerHTML='<p style="color:#a89d86">Abhi koi photo nahi hai.</p>';return;}
    g.list.forEach(function(p){
      var row=document.createElement('div');row.className='row';
      var im=document.createElement('img');im.src=p.file;
      var d=document.createElement('div');d.textContent=p.title||'(no title)';
      var s=document.createElement('small');s.textContent=p.cat==='polish'?'Furniture Polish':'Custom Furniture Orders';d.appendChild(s);
      var b=document.createElement('button');b.className='del';b.textContent='Delete';
      b.onclick=function(){remove(p);};
      row.appendChild(im);row.appendChild(d);row.appendChild(b);box.appendChild(row);
    });
  }catch(e){$('list').textContent=e.message;}
}
async function remove(p){
  if(!confirm('Ye photo delete karni hai?')) return;
  try{
    var r = await api(p.file+'?ref=main');
    if(r.ok){
      var j = await r.json();
      var d = await api(p.file,{method:'DELETE',body:JSON.stringify({message:'Delete photo',sha:j.sha})});
      if(!d.ok) await fail(d);
    }
    var g = await getGallery();
    await putGallery(g.list.filter(function(x){return x.file!==p.file;}), g.sha);
    show('Photo delete ho gayi. Website par 1-2 minute mein hat jayegi.', true);
    render();
  }catch(e){show(e.message,false);}
}
$('save').onclick=function(){
  localStorage.setItem('bf_owner',$('owner').value.trim());
  localStorage.setItem('bf_repo',$('repo').value.trim());
  localStorage.setItem('bf_token',$('token').value.trim());
  show('Save ho gaya.', true); render();
};
$('up').onclick=async function(){
  var files=$('files').files;
  if(!files.length){show('Pehle photo chuno.',false);return;}
  if(!$('token').value.trim()){show('Pehle token save karo.',false);return;}
  $('up').disabled=true;
  try{
    var added=[];
    for(var i=0;i<files.length;i++){
      show('Upload ho rahi hai '+(i+1)+' / '+files.length+' ...', true);
      var data=await resize(files[i]);
      var name='images/'+Date.now()+'-'+i+'.jpg';
      var r=await api(name,{method:'PUT',body:JSON.stringify({message:'Add photo',content:data})});
      if(!r.ok) await fail(r);
      added.push({cat:$('cat').value,file:name,title:$('title').value.trim()});
    }
    var g=await getGallery();
    await putGallery(added.reverse().concat(g.list), g.sha);
    show(added.length+' photo upload ho gayi. Website par 1-2 minute mein dikhegi.', true);
    $('files').value='';$('title').value='';
    render();
  }catch(e){show(e.message,false);}
  $('up').disabled=false;
};
if($('token').value) render();
</script>
</body>
</html>
